name: Upstream Sync

on:
  schedule:
    - cron: '0 4 * * 1' # Run weekly on Mondays at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    name: Sync with upstream lowlighter/metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git & Rerere
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config rerere.enabled true

      - name: Fetch upstream changes
        run: |
          git remote add upstream https://github.com/lowlighter/metrics.git || true
          git fetch upstream master

      - name: Update master mirror branch
        id: update_mirror
        run: |
          git checkout master
          UPSTREAM_COMMITS=$(git rev-list master..upstream/master --count)
          echo "Upstream commits ahead of master mirror: $UPSTREAM_COMMITS"
          if [ "$UPSTREAM_COMMITS" -gt 0 ]; then
            git merge --ff-only upstream/master
            git push origin master
            echo "mirror_updated=true" >> $GITHUB_OUTPUT
          else
            echo "mirror_updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Check divergence against maintained main
        id: check_divergence
        run: |
          git checkout main
          NEW_COMMITS=$(git rev-list main..upstream/master --count)
          echo "Upstream commits ahead of main: $NEW_COMMITS"
          echo "new_commits_count=$NEW_COMMITS" >> $GITHUB_OUTPUT

      - name: Attempt Clean Merge on Sync Branch
        if: steps.check_divergence.outputs.new_commits_count > 0
        id: attempt_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH_NAME" main
          
          # Attempt automated merge
          if git merge upstream/master -m "chore(sync): automated sync with upstream lowlighter/metrics ($(date +%Y-%m-%d))"; then
            echo "merge_status=clean" >> $GITHUB_OUTPUT
            git push -u origin "$BRANCH_NAME"
            cat << 'EOF' > /tmp/pr_body.md
          ### 🔄 Automated Upstream Sync (Clean Merge)

          Upstream changes from `lowlighter/metrics:master` have been cleanly integrated into this sync branch without merge conflicts.

          - **Upstream commits count**: ${{ steps.check_divergence.outputs.new_commits_count }}
          - **Merge strategy**: 3-way recursive / ORT merge
          - **Conflict status**: Clean (0 conflicts)

          Please review CI test suite and merge into `main`.
          EOF
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore(sync): clean sync with upstream lowlighter/metrics ($(date +%Y-%m-%d))" \
              --body-file /tmp/pr_body.md
          else
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            CONFLICTING_FILES=$(git diff --name-only --diff-filter=U)
            echo "Conflicting files:"
            echo "$CONFLICTING_FILES"
            git merge --abort
            
            # Create a branch for manual resolution
            git checkout -b "$BRANCH_NAME-conflicts" upstream/master
            git push -u origin "$BRANCH_NAME-conflicts"
            
            cat << EOF > /tmp/pr_body.md
          ### ⚠️ Upstream Sync Requires Conflict Resolution

          Upstream changes from \`lowlighter/metrics:master\` contain conflicts with community fork modifications.

          #### ⚡ Conflicting Files:
          \`\`\`
          $CONFLICTING_FILES
          \`\`\`

          #### 🛠️ Resolution Steps:
          1. Check out community main: \`git checkout main\`
          2. Pull sync branch: \`git merge upstream/master\`
          3. Resolve conflicts, run tests (\`npm test\`), and commit.
          4. Push to \`main\`.
          EOF
            gh pr create \
              --base main \
              --head "$BRANCH_NAME-conflicts" \
              --title "chore(sync): [CONFLICTS] sync with upstream lowlighter/metrics ($(date +%Y-%m-%d))" \
              --body-file /tmp/pr_body.md
          fi
