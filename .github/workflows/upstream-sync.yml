name: Upstream Sync

on:
  schedule:
    - cron: '0 4 * * 1' # Run weekly on Mondays at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync with upstream lowlighter/metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream changes
        run: |
          git remote add upstream https://github.com/lowlighter/metrics.git || true
          git fetch upstream master

      - name: Update master mirror branch
        id: update_mirror
        run: |
          git checkout master
          UPSTREAM_COMMITS=$(git rev-list master..upstream/master --count)
          echo "Upstream commits ahead of master mirror: $UPSTREAM_COMMITS"
          if [ "$UPSTREAM_COMMITS" -gt 0 ]; then
            git merge --ff-only upstream/master
            git push origin master
            echo "mirror_updated=true" >> $GITHUB_OUTPUT
          else
            echo "mirror_updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Check divergence against maintained main
        id: check_divergence
        run: |
          git checkout main
          NEW_COMMITS=$(git rev-list main..upstream/master --count)
          echo "Upstream commits ahead of main: $NEW_COMMITS"
          echo "new_commits_count=$NEW_COMMITS" >> $GITHUB_OUTPUT

      - name: Create Sync Pull Request
        if: steps.check_divergence.outputs.new_commits_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH_NAME" upstream/master
          git push -u origin "$BRANCH_NAME"
          cat << 'EOF' > /tmp/pr_body.md
          Automated synchronization with upstream `lowlighter/metrics:master`.
          
          Please review and run CI tests before merging into `main` to prevent regressions.
          EOF
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore(sync): sync with upstream lowlighter/metrics ($(date +%Y-%m-%d))" \
            --body-file /tmp/pr_body.md
