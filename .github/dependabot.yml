version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "📦 dependencies"
    groups:
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "puppeteer*"
    commit-message:
      prefix: "chore(deps)"

  # Docker base image
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "📦 dependencies"
      - "🐳 docker"
    commit-message:
      prefix: "chore(docker)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "📦 dependencies"
      - "🤖 actions"
    commit-message:
      prefix: "chore(actions)"
